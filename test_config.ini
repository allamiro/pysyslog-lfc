[settings]
log_level = info
time_input_format = auto
buffering = enabled
buffer_type = memory
flush_every = 1s
max_buffer = 10000
on_overflow = block
metrics = enabled

[use]
components = input.file, parser.rfc3164, parser.passthrough, output.file, output.memory

[flow.test_file]
name.type = flow
name.description = "Test File Processing Flow"
input.type = file
input.path = /home/tsuliman/Desktop/PYSYSLOGLFC/pysyslog-lfc/sample_logs.txt
input.follow = false
parser.type = rfc3164
output.type = file
output.path = /home/tsuliman/Desktop/PYSYSLOGLFC/pysyslog-lfc/processed_logs.json
output.format = json
output.rotation = disabled

[flow.test_passthrough]
name.type = flow
name.description = "Test Passthrough Flow"
input.type = file
input.path = /home/tsuliman/Desktop/PYSYSLOGLFC/pysyslog-lfc/sample_logs.txt
input.follow = false
parser.type = passthrough
output.type = file
output.path = /home/tsuliman/Desktop/PYSYSLOGLFC/pysyslog-lfc/passthrough_logs.txt
output.format = text
output.rotation = disabled
